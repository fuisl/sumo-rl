defaults:
  - logging: wandb
  - scenario: resco_grid4x4
  - algorithm: ppo
  - _self_

experiment:
  name: rllib
  project: marl-traffic-gat
  group: null
  tags: []
  seed: 42
  runs: 1
  episodes: 200
  episode_seconds: 3600
  validation_interval_episodes: 5
  validation_interval_steps: null
  eval_episodes: 1
  eval_seeds: null
  fixed_ts: false

resources:
  # Ray CPU resources are logical scheduler slots; native thread caps keep
  # Torch/NumPy/BLAS-style libraries from oversubscribing those slots.
  # Default to a local Ray instance for reproducible standalone runs.
  # On SLURM, pass resources.ray_num_cpus from SLURM_CPUS_PER_TASK and keep
  # ray_address=null unless the cluster explicitly provides a shared Ray head.
  ray_address: null
  ray_num_cpus: 2
  native_num_threads: 1
  # Preserve CUDA_VISIBLE_DEVICES from the scheduler by default. Set this only
  # for manual runs where you need to pin physical GPU ids yourself.
  cuda_visible_devices: null

algorithm:
  params:
    # Index within CUDA_VISIBLE_DEVICES for the local RLlib learner.
    local_gpu_idx: 0
    # Keep RLlib sampling and learning inside Ray actors so shared Ray clusters
    # can account for CPU/GPU use and avoid oversubscribing parallel jobs.
    ray_num_gpus: auto
    num_env_runners: 0
    num_envs_per_env_runner: 1
    num_cpus_per_env_runner: 1
    num_gpus_per_env_runner: 0
    num_learners: 1
    num_cpus_per_learner: 1
    # Fractional GPU lets multiple learner actors share the selected physical
    # device when memory headroom is available. Override to 1 for exclusive use.
    num_gpus_per_learner: 0.1

env:
  factory: parallel_env
  kwargs:
    add_system_info: true
    add_per_agent_info: true
    single_agent: false
    tripinfo_output_name: null

hydra:
  run:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
