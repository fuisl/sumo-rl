# @package _global_
algorithm:
  kind: fgsv3
  params:
    policy_mode: shared
    actor_lr: 0.0001
    critic_lr: 0.0001
    alpha_lr: 0.0001
    tau: 0.005
    gamma: 0.95
    grad_clip: 5.0
    # Match the learner-light SAC ratio used by sac_builtin. FGSv3 already
    # performs several graph/critic passes per learner step, so the default
    # natural replay ratio is far slower than PPO on RESCO-sized networks.
    train_batch_size_per_learner: 64
    training_intensity: 1.0
    replay_buffer_type: MultiAgentEpisodeReplayBuffer
    replay_buffer_capacity: 100000
    replay_buffer_alpha: 0.6
    replay_buffer_beta: 0.4
    num_steps_sampled_before_learning_starts: 1000
    target_network_update_freq: 1
    n_step: 1
    twin_q: true
    model_config:
      architecture_tag: fgsv3_frap_demand_gatv2_factored_sac
      twin_q: true
      frap:
        demand_shape: 2
        demand_layout: split
        observation_has_phase: true
        observation_has_min_green: true
        lane_embed_units: 16
        conv_units: 32
      adapter:
        dim: 64
        hidden_dims: []
        activation: relu
      communication:
        enabled: true
        type: gatv2
        num_heads: 4
        head_dim: 16
        demand_comm_dim: 64
        phase_emb_dim: 16
        residual_gate_init: 0.0
      actor:
        hidden_dims: [128]
        activation: relu
      critic:
        type: factored_neighborhood
        hidden_dims: [256, 256]
        activation: relu
      topology:
        source: tls_super_edges
        render: true
      invalid_action_value: -1000000000.0
