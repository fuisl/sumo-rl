# @package _global_
defaults:
  - sac_builtin
  - _self_

algorithm:
  kind: sac_dcrnn_actor
  params:
    train_batch_size_per_learner: 32
    history_len: 5
    include_virtual_nodes: true
    add_self_loops: true
    observation_dtype: float16
    model_config:
      architecture_tag: sac_dcrnn_actor
      feature_layout: phase_min_green_density_queue
      # Experimental ablation: actor is graph-encoded, critics stay on the MLP path.
      actor:
        encoder:
          type: dcrnn
          hidden_dim: 128
          max_diffusion_step: 2
          num_rnn_layers: 1
          filter_type: dual_random_walk
        head:
          hidden_dims: []
          activation: relu
      critic:
        encoder:
          type: mlp
          hidden_dims: [256, 256]
          activation: tanh
        head:
          hidden_dims: []
          activation: relu
        twin_q: true
      communication:
        enabled: false
        type: none
        apply_to: [actor, critic]
        scope: module
