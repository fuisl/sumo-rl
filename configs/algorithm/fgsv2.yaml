# @package _global_
algorithm:
  kind: fgsv2
  params:
    policy_mode: shared
    actor_lr: 0.0001
    critic_lr: 0.0001
    alpha_lr: 0.0001
    tau: 0.005
    gamma: 0.95
    grad_clip: 5.0
    train_batch_size_per_learner: 256
    num_env_runners: 0
    num_envs_per_env_runner: 1
    num_gpus_per_learner: auto
    ray_num_gpus: auto
    replay_buffer_type: MultiAgentPrioritizedEpisodeReplayBuffer
    replay_buffer_capacity: 100000
    replay_buffer_alpha: 0.6
    replay_buffer_beta: 0.4
    num_steps_sampled_before_learning_starts: 2000
    target_network_update_freq: 1
    n_step: 1
    twin_q: true
    model_config:
      architecture_tag: fgsv2_frap_tokens_gnn_sac
      twin_q: true
      frap:
        demand_shape: 2
        demand_layout: split
        observation_has_phase: true
        observation_has_min_green: true
        conv_units: 32
      adapter:
        dim: 128
        hidden_dims: []
        activation: relu
      communication:
        enabled: true
        type: gatv2
        num_heads: 4
        head_dim: 16
        residual_gate_init: 0.0
      actor:
        hidden_dims: [128]
        activation: relu
      critic:
        type: central_graph_joint_action
        hidden_dims: [256, 256]
        activation: relu
      topology:
        source: tls_super_edges
        render: true
      invalid_action_value: -1000000000.0
