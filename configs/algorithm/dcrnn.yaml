# @package _global_
algorithm:
  kind: dqn_dcrnn
  params:
    policy_mode: independent
    lr: 0.001
    gamma: 0.95
    grad_clip: 5.0
    train_batch_size_per_learner: 8
    replay_buffer_type: MultiAgentPrioritizedEpisodeReplayBuffer
    replay_buffer_capacity: 50000
    replay_buffer_alpha: 0.6
    replay_buffer_beta: 0.4
    num_steps_sampled_before_learning_starts: 1000
    target_network_update_freq: 500
    epsilon:
      - [0, 0.1]
      - [100000, 0.01]
    dueling: false
    double_q: true
    num_atoms: 1
    history_len: 3
    include_virtual_nodes: true
    add_self_loops: true
    model_config:
      architecture_tag: dqn_dcrnn
      feature_layout: phase_min_green_density_queue
      hid_dim: 128
      max_diffusion_step: 2
      num_rnn_layers: 1
      filter_type: dual_random_walk
