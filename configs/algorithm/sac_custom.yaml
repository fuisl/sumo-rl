# @package _global_
env:
  kwargs:
    use_libsumo: true

algorithm:
  kind: sac_mlp
  params:
    policy_mode: independent
    actor_lr: 0.0003
    critic_lr: 0.0003
    alpha_lr: 0.0003
    tau: 0.005
    train_batch_size_per_learner: 256
    num_steps_sampled_before_learning_starts: 1000
    model_config:
      architecture_tag: sac_mlp
      actor:
        encoder:
          type: mlp
          hidden_dims: [256, 256]
          activation: tanh
        head:
          hidden_dims: []
          activation: relu
      critic:
        encoder:
          type: mlp
          hidden_dims: [256, 256]
          activation: tanh
        head:
          hidden_dims: []
          activation: relu
        twin_q: true
      communication:
        enabled: false
        type: none
        apply_to: [actor, critic]
        scope: module
