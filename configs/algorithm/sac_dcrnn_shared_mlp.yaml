# @package _global_
defaults:
  - sac_builtin
  - _self_

algorithm:
  kind: sac_dcrnn_shared_mlp
  params:
    history_len: 5
    include_virtual_nodes: true
    add_self_loops: true
    model_config:
      architecture_tag: sac_dcrnn_shared_mlp
      encoder_layout: shared
      shared_encoder:
        type: dcrnn
        hidden_dim: 128
        max_diffusion_step: 2
        num_rnn_layers: 1
        filter_type: dual_random_walk
        pre_encoder:
          enabled: true
          hidden_dim: 128
          activation: relu
      actor:
        head:
          hidden_dims: []
          activation: relu
      critic:
        head:
          hidden_dims: []
          activation: relu
        twin_q: true
      communication:
        enabled: false
        type: none
        apply_to: [actor, critic]
        scope: module
