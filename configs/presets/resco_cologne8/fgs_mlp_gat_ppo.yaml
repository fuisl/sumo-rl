# @package _global_
defaults:
  - /rllib
  - override /scenario: resco_cologne8
  - override /algorithm: fgs_ppo
  - _self_

experiment:
  name: ${scenario.name}__fgs_mlp_gat_ppo

algorithm:
  params:
    model_config:
      architecture_tag: fgs_mlp_gat_ppo
      local_encoder:
        type: mlp
        output_dim: 128
        hidden_dims: [256, 256]
        activation: relu
      communication:
        enabled: true
        type: gat
        num_heads: 5
        head_dim: 16
        output_dim: 128
      topology:
        source: tls_super_edges
        render: true
