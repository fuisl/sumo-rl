# @package _global_
defaults:
  - /rllib
  - override /scenario: resco_cologne8
  - override /algorithm: fgs
  - _self_

experiment:
  name: ${scenario.name}__fgs_frap_gat_sac

algorithm:
  params:
    model_config:
      architecture_tag: fgs_frap_gat_sac
      local_encoder:
        type: frap
        output_dim: 128
        frap:
          demand_shape: 2
          demand_layout: split
          observation_has_phase: true
          observation_has_min_green: true
          conv_units: 32
      communication:
        enabled: true
        type: gat
        num_heads: 5
        head_dim: 16
        output_dim: 128
      critic:
        type: central_graph_joint_action
        hidden_dims: [256, 256]
        activation: relu
      topology:
        source: tls_super_edges
        render: true
