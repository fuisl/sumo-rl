# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=ges,additionals
          - --skip=experiments/archive/*.ipynb
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  # - repo: https://github.com/pycqa/pydocstyle
  #   rev: 6.3.0
  #   hooks:
  #     - id: pydocstyle
  #       exclude: ^(tests/|docs/|setup\.py|nets/|experiments/|outputs/|scripts/|sumo_rl/agents/|sumo_rl/experiments/|sumo_rl/models/|sumo_rl/nets/|sumo_rl/util/|sumo_rl/environment/graph_env\.py$)
  #       args:
  #         - --source
  #         - --explain
  #         - --convention=google
  #       additional_dependencies: ["toml"]
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: node
        pass_filenames: false
        types: [python]
        additional_dependencies: ["pyright"]
        args:
          - --project=pyproject.toml
      - id: local-heavy-validation
        name: local-heavy-validation
        entry: powershell -ExecutionPolicy Bypass -File scripts/test_local_heavy.ps1
        language: system
        pass_filenames: false
        stages: [pre-push]
