name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install pre-commit
      - run: pre-commit run --all-files
