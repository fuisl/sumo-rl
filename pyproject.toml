[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo-rl"
description="RL environments and learning code for traffic signal control in SUMO."
readme = "README.md"
requires-python = ">= 3.10"
authors = [{ name = "Lucas Alegre", email = "lucasnale@gmail.com" }]
license = { text = "MIT License" }
keywords = ["Reinforcement Learning", "Traffic Signal Control", "SUMO", "RL", "PettingZoo", "gymnasium"]
dependencies = [
    "gymnasium>=0.28",
    "pettingzoo>=1.24.3",
    "numpy",
    "pandas",
    "pillow",
    "sumolib>=1.14.0",
    "traci>=1.14.0",
]
dynamic = ["version"]

[project.optional-dependencies]
rendering = ["pyvirtualdisplay", "imageio>=2.34.0", "imageio-ffmpeg>=0.5.1"]
experiments = [
   "hydra-core>=1.3.2",
   "matplotlib>=3.10.9",
   "omegaconf>=2.3.0",
   "python-dotenv>=1.0.0",
   "wandb>=0.17.0",
   "imageio>=2.34.0",
   "imageio-ffmpeg>=0.5.1",
]
rllib = [
   "ray[rllib]>=2.55.0",
   "torch>=2.0",
   "supersuit>=3.9.1",
]
rllib-custom = [
   "torch-geometric>=2.5.0",
]
server = [
   "eclipse-sumo>=1.24.0",
   "hydra-core>=1.3.2",
   "imageio>=2.34.0",
   "imageio-ffmpeg>=0.5.1",
   "ipykernel>=7.3.0",
   "libsumo>=1.24.0",
   "matplotlib>=3.10.9",
   "omegaconf>=2.3.0",
   "pytest==7.1.3",
   "python-dotenv>=1.0.0",
   "pyvirtualdisplay",
   "ray[rllib]>=2.55.0",
   "supersuit>=3.9.1",
   "torch>=2.0",
   "torch-geometric>=2.5.0",
   "wandb>=0.17.0",
]
testing = ["pytest ==7.1.3"]

[project.urls]
Homepage = "https://lucasalegre.github.io/sumo-rl"
Repository = "https://github.com/LucasAlegre/sumo-rl"
Documentation = "https://lucasalegre.github.io/sumo-rl"
"Bug Report" = "https://github.com/LucasAlegre/sumo-rl/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sumo_rl", "sumo_rl.*"]

[tool.setuptools.package-data]
"*" = ["*.xml", "*.sumocfg"]
nets = [
    "*.xml", "*.sumocfg",
]

# Linters and Test tools #######################################################

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["experiments", "nets", "outputs", "multirun", "ray_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E203", "E741"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202"]

[tool.pyright]
include = ["sumo_rl/**", "tests/**"]
exclude = ["**/node_modules", "**/__pycache__"]
strict = []

typeCheckingMode = "off"
pythonVersion = "3.10"
pythonPlatform = "All"
typeshedPath = "typeshed"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, pygame)
#   Therefore, we have to ignore missing imports
reportMissingImports = "none"
# Some modules are missing type stubs, which is an issue when running pyright locally
reportMissingTypeStubs = false
# For warning and error, will raise an error when
reportInvalidTypeVarUse = "none"

# reportUnknownMemberType = "warning"  # -> raises warnings
# reportUnknownParameterType = "warning"  # -> raises warnings
# reportUnknownVariableType = "warning"  # -> raises warnings
# reportUnknownArgumentType = "warning"  # -> raises warnings
reportGeneralTypeIssues = "none"  # -> commented out raises 489 errors
reportArgumentType = "none"
reportUntypedFunctionDecorator = "none"  # -> pytest.mark.parameterize issues

reportOptionalMemberAccess = "none" # -> commented out raises warnings
reportPrivateImportUsage = "warning" # -> this raises warnings because we use not exported modules from gym (wrappers)

reportPrivateUsage = "warning"
reportUnboundVariable = "warning"
reportCallIssue = "warning"
reportAttributeAccessIssue = "warning"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".pytest_cache", ".pytest_tmp", "ray_results", "outputs", "multirun", "*.egg-info"]
filterwarnings = ['ignore:.*The environment .* is out of date.*']
markers = [
    "core_fast: lightweight pure-Python or mocked wiring checks required in CI for supported workflows",
    "local_heavy: developer-machine SUMO-backed smoke checks for supported workflows",
    "research_heavy: broader RLlib, model-variant, and experimental coverage kept out of the required supported baseline",
]
# filterwarnings = ['ignore:.*step API.*:DeprecationWarning']
